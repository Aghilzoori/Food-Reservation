<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>خطا</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Vazirmatn, Tahoma, sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
                url("https://images.unsplash.com/photo-1498837167922-ddd27525d352");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .error-box {
            width: 450px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h2 {
            color: red;
            margin-bottom: 25px;
            font-size: 22px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            padding: 12px 30px;
            background: #e67e22;
            color: white;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            background: #d35400;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

<div class="error-box">
    <h2>{{ error }}</h2>
    <a href="{% url 'student_dashboard' %}">⬅ بازگشت به داشبورد</a>
</div>

</body>
</html>
