<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ورود دانش‌آموز</title>
  
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Vazirmatn, sans-serif;
}
  
body{
    height:100vh;
    background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
                url("https://images.unsplash.com/photo-1498837167922-ddd27525d352");
    background-size: cover;
    background-position: center;
    display:flex;
    justify-content:center;
    align-items:center;
}
  
.login-box{
    width:400px;
    padding:40px;
    background: rgba(255,255,255,0.95);
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
    text-align:center;
}
  
.login-box h2{
    margin-bottom:10px;
    color:#d35400;
}
  
.subtitle{
    font-size:14px;
    margin-bottom:25px;
    color:#555;
}
  
.input-group{
    margin-bottom:18px;
    text-align: right; 
}

.login-box ul {
    list-style: none;
}

.login-box li {
    margin-bottom: 18px;
}

.login-box input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
    font-size:14px;
    transition:0.3s;
    text-align: right;
}
  
.login-box input:focus{
    border-color:#e67e22;
    box-shadow:0 0 8px rgba(230,126,34,0.4);
    outline:none;
}

.login-box label {
    display: block;
    margin-bottom: 5px;
    font-size: 14px;
    color: #333;
}
  
button{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    background:#e67e22;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    margin-top: 10px;
}
  
button:hover{
    background:#d35400;
    transform:scale(1.03);
}
  
.icon{
    font-size:40px;
    margin-bottom:15px;
}
  
.error{
    margin-top:15px;
    color:red;
    font-size:14px;
}
</style>
</head>
  
<body>
  
<div class="login-box">
  
<div class="icon">🎓</div>
  
<h2>ورود دانش‌آموز</h2>
<div class="subtitle">سامانه مدیریت دانش‌آموزی</div>
  
<form method="post">
    {% csrf_token %}
    
    <div class="input-group">
        {{ form.as_p }}
    </div>
  
    <button type="submit">ورود</button>
</form>
  
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
  
</div>
  
</body>
</html>
