<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ثبت غذای روزانه</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Vazirmatn, Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
                url("https://images.unsplash.com/photo-1498837167922-ddd27525d352");
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        h2 {
            color: white;
            margin-bottom: 20px;
            font-size: 26px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        form {
            width: 480px;
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            color: #444;
            font-weight: bold;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 14px;
            transition: 0.3s;
            text-align: right;
        }

        input:focus, select:focus {
            border-color: #e67e22;
            box-shadow: 0 0 8px rgba(230, 126, 34, 0.4);
            outline: none;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: none;
            background: #e67e22;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #d35400;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

<h2>🍽️ ثبت غذای روزانه</h2>

<form method="post">
    {% csrf_token %}

    <label>روز هفته</label>
    <select name="day" required>
        <option value="">انتخاب کنید</option>
        <option value="sat">شنبه</option>
        <option value="sun">یکشنبه</option>
        <option value="mon">دوشنبه</option>
        <option value="tue">سه‌شنبه</option>
        <option value="wed">چهارشنبه</option>
        <option value="thu">پنجشنبه</option>
        <option value="fri">جمعه</option>
    </select>

    <label>صبحانه</label>
    <input type="text" name="breakfast" placeholder="مثلاً نان و پنیر">

    <label>ناهار</label>
    <input type="text" name="lunch" placeholder="مثلاً چلو مرغ">

    <label>شام</label>
    <input type="text" name="dinner" placeholder="مثلاً سوپ">

    <label>قیمت کل (تومان)</label>
    <input type="number" name="total_price" placeholder="مثلاً 75000">

    <button type="submit">✅ ثبت</button>
</form>

</body>
</html>
