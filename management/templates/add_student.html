<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>افزودن هنرجو</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Vazirmatn, Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
                url("https://images.unsplash.com/photo-1498837167922-ddd27525d352");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-box {
            width: 450px;
            padding: 35px 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #d35400;
            font-size: 24px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            color: #444;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 14px;
            transition: 0.3s;
            text-align: right;
        }

        input:focus {
            border-color: #e67e22;
            box-shadow: 0 0 8px rgba(230, 126, 34, 0.4);
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 13px;
            border-radius: 10px;
            border: none;
            background: #e67e22;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #d35400;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

<div class="form-box">
    <h2>👤 افزودن هنرجو</h2>

    <form action='' method='POST', enctype='multipart/form-data'>
        {% csrf_token %}
        
        {{form}}

        <button type="submit">✅ ثبت اطلاعات</button>
    </form>
</div>

</body>
</html>
