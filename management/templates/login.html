<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Vazirmatn, Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
                url("https://images.unsplash.com/photo-1498837167922-ddd27525d352");
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            padding: 40px 20px;
        }

        .box {
            width: 500px;
            max-width: 90%;
            padding: 35px 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.2s;
        }

        .box:hover {
            transform: translateY(-3px);
        }

        h1 {
            color: #d35400;
            margin-bottom: 15px;
            font-size: 22px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
            font-size: 15px;
            line-height: 1.7;
        }

        .error {
            color: #c0392b;
            font-weight: bold;
            margin: 10px 0 18px;
            font-size: 14px;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.15);
            outline: none;
            font-size: 14px;
            transition: 0.2s;
            background: #fff;
        }

        input:focus {
            border-color: #e67e22;
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.25);
        }

        button {
            width: 100%;
            padding: 12px 30px;
            background: #e67e22;
            color: white;
            border: none;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 6px;
        }

        button:hover {
            background: #d35400;
            transform: scale(1.02);
        }

        .link {
            display: inline-block;
            margin-top: 10px;
            color: #d35400;
            text-decoration: none;
            font-weight: bold;
        }

        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>🔐 ورود</h1>

    {% if form.errors %}
        <div class="error">نام کاربری یا کلمه عبور اشتباه است.</div>
    {% endif %}

    <p>
        لطفاً نام کاربری و پسورد خود را وارد کنید.
    </p>

    <form action="{% url 'login' %}" method="POST">
        {% csrf_token %}

        <input type="text" name="username" placeholder="نام حساب کاربری" required>

        <input type="password" name="password" placeholder="پسورد" required>

        <button type="submit">ورود</button>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </form>
</div>

</body>
</html>
